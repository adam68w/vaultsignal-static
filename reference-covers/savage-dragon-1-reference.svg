<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Savage Dragon #1 reference information card</title>
  <desc id="desc">Local reference information artwork for Savage Dragon issue 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e5f4d9"/>
      <stop offset="55%" stop-color="#86c35e"/>
      <stop offset="100%" stop-color="#22412c"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1040" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="664" height="984" rx="30" fill="none" stroke="rgba(29,66,42,0.18)"/>
  <text x="64" y="118" fill="#22412c" font-family="Arial, sans-serif" font-size="30" font-weight="700">IMAGE</text>
  <text x="592" y="118" fill="#32593c" font-family="Arial, sans-serif" font-size="28" text-anchor="end">1992</text>
  <text x="64" y="292" fill="#17301f" font-family="Arial, sans-serif" font-size="88" font-weight="900">SAVAGE</text>
  <text x="64" y="374" fill="#17301f" font-family="Arial, sans-serif" font-size="100" font-weight="900">DRAGON</text>
  <rect x="64" y="450" width="196" height="62" rx="14" fill="rgba(29,66,42,0.12)"/>
  <text x="162" y="491" fill="#17301f" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ISSUE #1</text>
  <text x="64" y="866" fill="#17301f" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
  <text x="64" y="914" fill="#22412c" font-family="Arial, sans-serif" font-size="24">Local only / Add your cover photo when ready</text>
</svg>
