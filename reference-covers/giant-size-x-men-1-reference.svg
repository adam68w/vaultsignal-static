<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Giant-Size X-Men #1 reference information card</title>
  <desc id="desc">Local reference information artwork for Giant-Size X-Men issue 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#d2a63c"/>
      <stop offset="52%" stop-color="#26446e"/>
      <stop offset="100%" stop-color="#111725"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1040" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="664" height="984" rx="30" fill="none" stroke="rgba(255,255,255,0.16)"/>
  <text x="64" y="118" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">MARVEL</text>
  <text x="592" y="118" fill="#f8eed1" font-family="Arial, sans-serif" font-size="28" text-anchor="end">1975</text>
  <text x="64" y="282" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="900">GIANT-SIZE</text>
  <text x="64" y="352" fill="#ffffff" font-family="Arial, sans-serif" font-size="74" font-weight="900">X-MEN</text>
  <rect x="64" y="438" width="196" height="62" rx="14" fill="rgba(255,255,255,0.12)"/>
  <text x="162" y="479" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ISSUE #1</text>
  <text x="64" y="866" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
  <text x="64" y="914" fill="#f8eed1" font-family="Arial, sans-serif" font-size="24">Local only / Add your cover photo when ready</text>
</svg>
