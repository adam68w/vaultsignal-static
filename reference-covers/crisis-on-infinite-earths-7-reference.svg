<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Crisis on Infinite Earths #7 reference information card</title>
  <desc id="desc">Local reference information artwork for Crisis on Infinite Earths issue 7.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#7f4cff"/>
      <stop offset="56%" stop-color="#221c5a"/>
      <stop offset="100%" stop-color="#0b1021"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1040" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="664" height="984" rx="30" fill="none" stroke="rgba(255,255,255,0.16)"/>
  <text x="64" y="118" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">DC</text>
  <text x="592" y="118" fill="#ddd5ff" font-family="Arial, sans-serif" font-size="28" text-anchor="end">1985</text>
  <text x="64" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="900">CRISIS ON</text>
  <text x="64" y="344" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="900">INFINITE</text>
  <text x="64" y="418" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="900">EARTHS</text>
  <rect x="64" y="470" width="196" height="62" rx="14" fill="rgba(255,255,255,0.13)"/>
  <text x="162" y="511" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ISSUE #7</text>
  <text x="64" y="866" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
  <text x="64" y="914" fill="#e2ddff" font-family="Arial, sans-serif" font-size="24">Local only / Add your cover photo when ready</text>
</svg>
