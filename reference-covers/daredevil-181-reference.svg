<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Daredevil #181 reference information card</title>
  <desc id="desc">Local reference information artwork for Daredevil issue 181.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#d03337"/>
      <stop offset="56%" stop-color="#5b0f18"/>
      <stop offset="100%" stop-color="#1f0b10"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1040" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="664" height="984" rx="30" fill="none" stroke="rgba(255,255,255,0.16)"/>
  <text x="64" y="118" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">MARVEL</text>
  <text x="592" y="118" fill="#ffd8d9" font-family="Arial, sans-serif" font-size="28" text-anchor="end">1982</text>
