  <rect x="64" y="392" width="196" height="62" rx="14" fill="rgba(255,255,255,0.13)"/>
  <text x="162" y="433" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ISSUE #1</text>
  <text x="64" y="866" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
