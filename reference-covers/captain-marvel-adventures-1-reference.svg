<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Captain Marvel Adventures #1 reference information card</title>
  <desc id="desc">Local reference information artwork for Captain Marvel Adventures issue 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f1db"/>
      <stop offset="52%" stop-color="#f0c95c"/>
      <stop offset="100%" stop-color="#7f3414"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1040" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="664" height="984" rx="30" fill="none" stroke="rgba(94,41,14,0.18)"/>
  <text x="64" y="118" fill="#5e290e" font-family="Arial, sans-serif" font-size="30" font-weight="700">FAWCETT</text>
  <text x="592" y="118" fill="#7f3414" font-family="Arial, sans-serif" font-size="28" text-anchor="end">1941</text>
  <text x="64" y="288" fill="#3d200b" font-family="Arial, sans-serif" font-size="58" font-weight="900">CAPTAIN MARVEL</text>
  <text x="64" y="360" fill="#3d200b" font-family="Arial, sans-serif" font-size="62" font-weight="900">ADVENTURES</text>
  <rect x="64" y="446" width="196" height="62" rx="14" fill="rgba(94,41,14,0.12)"/>
  <text x="162" y="487" fill="#3d200b" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ISSUE #1</text>
  <text x="64" y="866" fill="#3d200b" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
  <text x="64" y="914" fill="#5e290e" font-family="Arial, sans-serif" font-size="24">Local only / Add your cover photo when ready</text>
</svg>
