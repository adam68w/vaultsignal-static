<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">The Tick #1 reference information card</title>
  <desc id="desc">Local reference information artwork for The Tick issue 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f1ff"/>
      <stop offset="55%" stop-color="#91b2ff"/>
      <stop offset="100%" stop-color="#25357a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1040" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="664" height="984" rx="30" fill="none" stroke="rgba(32,49,108,0.18)"/>
  <text x="64" y="118" fill="#25357a" font-family="Arial, sans-serif" font-size="30" font-weight="700">NEW ENGLAND COMICS</text>
  <text x="592" y="118" fill="#344895" font-family="Arial, sans-serif" font-size="28" text-anchor="end">1988</text>
  <text x="64" y="324" fill="#18234f" font-family="Arial, sans-serif" font-size="108" font-weight="900">THE TICK</text>
  <rect x="64" y="438" width="196" height="62" rx="14" fill="rgba(32,49,108,0.12)"/>
  <text x="162" y="479" fill="#18234f" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ISSUE #1</text>
  <text x="64" y="866" fill="#18234f" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
  <text x="64" y="914" fill="#25357a" font-family="Arial, sans-serif" font-size="24">Local only / Add your cover photo when ready</text>
</svg>
