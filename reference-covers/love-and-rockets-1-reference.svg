<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Love and Rockets #1 reference information card</title>
  <desc id="desc">Local reference information artwork for Love and Rockets issue 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e8f4"/>
      <stop offset="56%" stop-color="#db8ab4"/>
      <stop offset="100%" stop-color="#572846"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1040" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="664" height="984" rx="30" fill="none" stroke="rgba(82,35,63,0.18)"/>
  <text x="64" y="118" fill="#572846" font-family="Arial, sans-serif" font-size="30" font-weight="700">FANTAGRAPHICS</text>
  <text x="592" y="118" fill="#713358" font-family="Arial, sans-serif" font-size="28" text-anchor="end">1982</text>
  <text x="64" y="298" fill="#391b2f" font-family="Arial, sans-serif" font-size="74" font-weight="900">LOVE AND</text>
  <text x="64" y="380" fill="#391b2f" font-family="Arial, sans-serif" font-size="86" font-weight="900">ROCKETS</text>
  <rect x="64" y="452" width="196" height="62" rx="14" fill="rgba(82,35,63,0.12)"/>
  <text x="162" y="493" fill="#391b2f" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ISSUE #1</text>
  <text x="64" y="866" fill="#391b2f" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
  <text x="64" y="914" fill="#572846" font-family="Arial, sans-serif" font-size="24">Local only / Add your cover photo when ready</text>
</svg>
