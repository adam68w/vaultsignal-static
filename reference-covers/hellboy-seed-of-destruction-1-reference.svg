  <text x="64" y="866" fill="#271319" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
  <text x="64" y="914" fill="#3c1d24" font-family="Arial, sans-serif" font-size="24">Local only / Add your cover photo when ready</text>
