  <rect x="64" y="446" width="218" height="62" rx="14" fill="rgba(42,62,34,0.12)"/>
  <text x="173" y="487" fill="#243522" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">ISSUE #20</text>
  <text x="64" y="866" fill="#243522" font-family="Arial, sans-serif" font-size="32" font-weight="700">REFERENCE INFORMATION</text>
  <text x="64" y="914" fill="#334430" font-family="Arial, sans-serif" font-size="24">Local only / Add your cover photo when ready</text>
